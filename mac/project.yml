name: HMNMenu
options:
  bundleIdPrefix: org.hmn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "0.2.0"
  CURRENT_PROJECT_VERSION: "2"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: NO
  ENABLE_HARDENED_RUNTIME: NO
  ENABLE_APP_SANDBOX: NO
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  HMNMenu:
    type: application
    platform: macOS
    sources:
      - path: HMNMenu
        excludes:
          - Info.plist
          - HMNMenu.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.hmn.menu
      INFOPLIST_FILE: HMNMenu/Info.plist
      CODE_SIGN_ENTITLEMENTS: HMNMenu/HMNMenu.entitlements
      GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - HMNMenuTests
  HMNMenuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HMNMenuTests
    dependencies:
      - target: HMNMenu
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.hmn.menu.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HMNMenu.app/Contents/MacOS/HMNMenu"
      BUNDLE_LOADER: "$(TEST_HOST)"
